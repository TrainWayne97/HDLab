services:
  mongo:
    image: mongo:4.4
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - hdlab_network

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    ports:
      - "5673:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - hdlab_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.runtime
    networks:
      - hdlab_network


  worker:
    build: ./apps/worker
    depends_on:
      backend:
        condition: service_started
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.runtime
    networks:
      - hdlab_network

    volumes:
      - ./simtmp:/simtmp
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build: ./apps/frontend
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    networks:
      - hdlab_network

  gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - hdlab_network
volumes:
  mongo_data:
  rabbitmq_data:

networks:
  hdlab_network:
    driver: bridge