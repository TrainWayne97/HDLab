# Container-Logs rotieren: Simulationsausgaben landen teilweise im Log des Workers und
# sollen die Platte nicht füllen
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  mongo:
    image: mongo:4.4
    restart: always
    logging: *logging
    volumes:
      - mongo_data:/data/db
    networks:
      - hdlab_network

  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    logging: *logging
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    networks:
      - hdlab_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./apps/backend
    restart: always
    logging: *logging
    depends_on:
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.runtime
    networks:
      - hdlab_network


  worker:
    build: ./apps/worker
    restart: always
    logging: *logging
    depends_on:
      backend:
        condition: service_started
      mongo:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    env_file:
      - .env.runtime
    networks:
      - hdlab_network

    volumes:
      - ./simtmp:/simtmp
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    # Production-Build, ausgeliefert von nginx (siehe apps/frontend/Dockerfile). Die
    # VITE_-Variablen kommen aus .env.runtime (--env-file) und landen beim Build im
    # öffentlichen JavaScript. Bewusst kein env_file: dieser Container braucht keine Secrets.
    build:
      context: ./apps/frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_TUTORIAL_SOLUTION_PASSWORD: ${VITE_TUTORIAL_SOLUTION_PASSWORD:-}
    restart: always
    logging: *logging
    depends_on:
      backend:
        condition: service_started
    networks:
      - hdlab_network

  gateway:
    image: nginx:alpine
    restart: always
    logging: *logging
    ports:
      - "8080:80"

    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - hdlab_network
volumes:
  mongo_data:
  rabbitmq_data:

networks:
  hdlab_network:
    driver: bridge