events {}

http {
  upstream frontend {
    server frontend:5173;
  }

  upstream backend {
    server backend:3001;
  }

  server {
    listen 80;

    server_name hdlab.eit.htwk-leipzig.de;

    # FRONTEND
    location / {
      proxy_pass http://frontend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # websocket support
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      # keep the Vite HMR websocket open - nginx's 60s default read/send
      # timeout was killing it, which makes Vite think the dev server
      # restarted and force a full page reload in a loop
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # API
    location /api/ {
      proxy_pass http://backend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}