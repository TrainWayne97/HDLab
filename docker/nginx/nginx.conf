events {}

http {
  upstream frontend {
    server frontend:5173;
  }

  upstream backend {
    server backend:3001;
  }

  server {
    listen 80;

    # FRONTEND
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # API
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;

      # wichtig für CORS / websocket später
      proxy_http_version 1.1;
    }
  }
}