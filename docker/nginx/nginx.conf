events {}

http {
  # Keine nginx-Version in Fehlerseiten und Headern
  server_tokens off;

  upstream frontend {
    server frontend:5173;
  }

  upstream backend {
    server backend:3001;
  }

  # Steht vor diesem Gateway noch ein Reverse Proxy (TLS-Terminierung), kommt die echte
  # Client-IP aus dessen X-Forwarded-For. Sonst sähe das Backend für alle Nutzer dieselbe
  # Proxy-IP, und die IP-basierten Rate-Limits würden alle gemeinsam treffen.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  server {
    listen 80;

    server_name hdlab.eit.htwk-leipzig.de;

    # Sicherheits-Header für alle Antworten
    # - keine Einbettung in fremde Seiten (Clickjacking)
    # - kein MIME-Sniffing (z.B. Simulationsausgaben als HTML/Script)
    # - keine vollständigen URLs an fremde Seiten
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # FRONTEND
    location / {
      proxy_pass http://frontend;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    # API
    location /api/ {
      proxy_pass http://backend;

      # Whole projects are sent as JSON (default 1m); same limit as the backend's express.json
      client_max_body_size 12m;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Genau eine Adresse (die oben ermittelte Client-IP), nichts vom Client Mitgeschicktes;
      # das Backend vertraut einem Proxy-Hop (TRUST_PROXY_HOPS, Standard 1)
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
