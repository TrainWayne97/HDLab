# Liefert das gebaute Frontend aus (siehe Dockerfile). Davor sitzt das Gateway
# (docker/nginx/nginx.conf), das /api an das Backend weiterleitet und die
# Sicherheits-Header setzt.
server {
  listen 5173;
  server_tokens off;
  root /usr/share/nginx/html;

  # Dateinamen enthalten einen Hash und ändern sich nie
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Routing im Browser (/Editor, /Tutorial/3, /Lehre/ES1/...): unbekannte Pfade -> index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
