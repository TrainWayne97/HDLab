name: Sync Tutorial

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}

    steps:
      # Dein eigenes Repository laden
      - name: Checkout TrainWayne97/HDLab
        uses: actions/checkout@v4

      # Das private externe Repository laden
      - name: Checkout VerilogTutorial repository
        uses: actions/checkout@v4
        with:
          repository: Chaos-097/VerilogTutorial
          token: ${{ secrets.VERILOGTUTORIAL }}
          path: external

      # Datei kopieren und umbenennen
      - name: Copy tutorial file
        run: |
          cp external/VerilogTutorial_V0.4.md \
             apps/frontend/public/Tutorial/VerilogTutorialFormatted.md

      # Bilder aus dem externen Repo übernehmen (gelöschte Bilder dort
      # werden per --delete auch bei uns entfernt)
      - name: Copy tutorial images
        run: |
          mkdir -p apps/frontend/public/Tutorial/images
          rsync -a --delete external/images/ apps/frontend/public/Tutorial/images/

      # Bildpfade umschreiben: ./images/... ist relativ zur Markdown-Datei
      # im externen Repo, wird bei uns aber als rohes HTML in die laufende
      # SPA eingefügt und dort relativ zur aktuellen Browser-URL aufgelöst
      # -> muss absolut sein, sonst 404 je nach Route.
      - name: Rewrite image paths
        run: |
          sed -i 's#\./images/#/Tutorial/images/#g' \
            apps/frontend/public/Tutorial/VerilogTutorialFormatted.md

      # Änderungen committen
      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add apps/frontend/public/Tutorial/VerilogTutorialFormatted.md \
                  apps/frontend/public/Tutorial/images/

          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update Verilog tutorial from external repository"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Läuft auf einem self-hosted Runner, der direkt auf dem hdlab-Server
  # registriert ist (Server ist nur über HTWK-VPN erreichbar, ein
  # GitHub-Cloud-Runner käme per SSH gar nicht dorthin).
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: [self-hosted, hdlab-server]

    steps:
      # Produktiv-Container neu bauen, damit die Änderung sichtbar wird
      # (Datei wird im Dockerfile per COPY gebacken, kein Bind-Mount ->
      # ohne Rebuild bleibt der laufende Frontend-Container auf altem Stand)
      - name: Pull latest changes and rebuild frontend container
        run: |
          cd ${{ vars.SERVER_REPO_PATH }}
          git pull
          docker compose --env-file .env.runtime -f docker-compose.yml up -d --build frontend
